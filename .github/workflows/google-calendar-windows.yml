name: Google Calendar Windows build and verification
on:
  push:
    branches: ['feature/google-calendar-readonly-20261106']
  workflow_dispatch:
jobs:
  windows-calendar:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run rebuild
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:google-calendar
      - run: pnpm build
      - run: pnpm test:google-calendar:windows
      - run: pnpm dist:win
      - name: Check installer and record hashes
        shell: pwsh
        run: |
          $installers = Get-ChildItem -LiteralPath release -Filter '*.exe'
          if (-not $installers) { throw 'Windows installers were not produced' }
          $installers | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content release/SHA256SUMS.json -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOCUS-Google-Calendar-Windows
          path: |
            release/*.exe
            release/SHA256SUMS.json
            docs/reports/google-calendar/
            docs/google-calendar/
