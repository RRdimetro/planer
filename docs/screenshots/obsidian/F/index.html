<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FOCUS OS PRO — реальные скриншоты 0.3.0</title><style>body{margin:0;background:#080e0b;color:#e4eee7;font:15px system-ui}header{padding:24px 32px;background:#142219;position:sticky;top:0;border-bottom:1px solid #2a4032}h1{font-size:24px;margin:0 0 10px}p{color:#9eb5a6;line-height:1.6}select,button{padding:10px 14px;background:#192d20;color:#d9eddf;border:1px solid #3a5a44;border-radius:7px;margin:4px;cursor:pointer}main{padding:20px 32px}nav{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:20px}button[aria-current=true]{border-color:#b4eac4;color:#b4eac4}img{max-width:100%;height:auto;border:1px solid #2d4435;border-radius:10px}a{color:#a0dfb3}footer{margin:20px 0;color:#92a499}</style><header><h1>Obsidian Command Center · 0.3.0</h1><p>Реальные снимки работающего Electron/Linux. 10 страниц, отдельные demo/empty базы, три размера. Макетов нет. Windows/DPI не проверены.</p><label>Данные <select id="workspace"><option value="demo">Изолированное demo</option><option value="empty">Пустое рабочее пространство</option></select></label><label>Размер <select id="size"><option>1920</option><option>1366</option><option>2560</option></select></label><span id="dimensions"></span></header><main><nav id="pages"></nav><a id="raw" target="_blank"><img id="shot" alt=""></a><footer>Клик по снимку открывает PNG в исходном разрешении. Все метрики demo — демонстрационные, отдельная SQLite-база.</footer></main><script>const titles=['Главная','Планировщик','Задачи','Проекты','Учёба','Тренировки','Аналитика','Фокус','Заметки','Настройки'];let page=1;const nav=document.querySelector('#pages');titles.forEach((title,i)=>{const button=document.createElement('button');button.textContent=String(i+1).padStart(2,'0')+' · '+title;button.onclick=()=>{page=i+1;render()};nav.append(button)});function render(){const w=document.querySelector('#size').value,h={1366:768,1920:1080,2560:1440}[w],mode=document.querySelector('#workspace').value,file=`${mode}-${page}-${w}.png`;document.querySelector('#shot').src=file;document.querySelector('#shot').alt=titles[page-1]+' · '+mode+' · '+w+'×'+h;document.querySelector('#raw').href=file;document.querySelector('#dimensions').textContent=w+' × '+h;nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',String(i===page-1)))}document.querySelectorAll('select').forEach(s=>s.onchange=render);render();</script></html>
