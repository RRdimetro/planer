name: Windows installer and upgrade verification
on: [push, workflow_dispatch]
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm run rebuild
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:rc
      - run: node scripts/rc-visual.mjs final
      - run: pnpm dist:win
      - name: Build and install actual 0.2.0 and 0.3.0 baselines
        shell: pwsh
        run: |
          $baselines = @(@{Version='0.2.0';Commit='d9e8446'},@{Version='0.3.0';Commit='ab86f30'})
          $currentVersion = (Get-Content package.json | ConvertFrom-Json).version
          $env:FOCUS_CURRENT_INSTALLER = Join-Path (Get-Location) "release/FOCUS OS PRO Setup $currentVersion.exe"
          foreach ($item in $baselines) {
            $baseline = Join-Path $env:RUNNER_TEMP "focus-baseline-$($item.Version)"
            git worktree add --detach $baseline $item.Commit
            if ($LASTEXITCODE -ne 0) { throw 'Full history required' }
            Push-Location $baseline
            pnpm install --frozen-lockfile
            if ($LASTEXITCODE -ne 0) { throw 'Baseline install failed' }
            pnpm run rebuild
            pnpm dist:win
            if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed' }
            Pop-Location
            $env:FOCUS_BASELINE_INSTALLER = Join-Path $baseline "release/FOCUS OS PRO Setup $($item.Version).exe"
            $env:FOCUS_BASELINE_VERSION = $item.Version
            node scripts/rc-windows-upgrade.mjs
            if ($LASTEXITCODE -ne 0) { throw 'Windows upgrade regression failed' }
          }
      - run: node scripts/rc-windows-portable.mjs
      - name: Native scale and visible OS notification evidence
        run: node scripts/rc-windows-platform.mjs
      - run: node scripts/rc-acceptance-gate.mjs
        if: always()
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: FOCUS-OS-PRO-Windows-results
          path: |
            release/*.exe
            docs/reports/obsidian/
            docs/reports/1.0-rc/
            docs/screenshots/obsidian/F/
            docs/screenshots/1.0-rc/
